<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{font-family:"Pretendard","Malgun Gothic",sans-serif;position:relative;overflow:hidden;
       background:linear-gradient(135deg,#f9fdff 0%,#eaf6fb 55%,#d9edf5 100%)}

  /* 오른쪽 인물 사진 */
  .photo{position:absolute;right:0;top:0;width:474px;height:630px;border-radius:44px 0 0 44px;
         background-image:url("girl.png");background-size:cover;background-position:center 6%;
         box-shadow:-24px 0 48px -34px rgba(15,55,68,.5)}
  .photo::before{content:"";position:absolute;left:0;top:0;width:112px;height:100%;border-radius:44px 0 0 44px;
         background:linear-gradient(90deg,rgba(243,251,254,1) 0%,rgba(243,251,254,.7) 40%,rgba(243,251,254,0) 100%)}

  /* 왼쪽 글 */
  .title{position:absolute;left:50px;top:28px;width:700px}
  .kicker{font-family:"Nanum Pen Script",cursive;font-size:34px;color:#3f6f7d;transform:rotate(-2.5deg);line-height:1;margin-left:4px}
  .big{font-size:122px;font-weight:900;letter-spacing:-6px;line-height:.97;margin-top:4px;
       -webkit-text-stroke:16px #fff;paint-order:stroke fill;
       filter:drop-shadow(6px 7px 0 rgba(15,55,68,.2))}
  .big .l1{color:#ff2f8e;display:block}
  .big .l2{color:#12b4d4;display:block}
  .band{display:inline-block;margin-top:12px;padding:6px 19px 8px;background:#ffe23d;border-radius:9px;
        transform:rotate(-1.2deg);font-size:32px;font-weight:900;letter-spacing:-2px;color:#0f3744;
        box-shadow:3px 5px 0 rgba(15,55,68,.18)}
  .band b{color:#ff2f8e}
  .sub{margin-top:12px;font-size:25px;font-weight:800;letter-spacing:-1.4px;color:#12525f}
  .sub span{border-bottom:5px solid #ff9ecb;padding-bottom:3px}

  .cards{position:absolute;left:50px;bottom:68px;width:596px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{border-radius:18px;padding:12px 12px 13px;text-align:center;box-shadow:0 12px 22px -14px rgba(15,55,68,.5)}
  .c1{background:#fdeaf4}.c2{background:#e6f1fd}
  .card .ic{font-size:24px;line-height:1}
  .card .t{margin-top:4px;font-size:23px;font-weight:900;letter-spacing:-1.4px;color:#0f3744}
  .card .t em{font-style:normal;color:#ff2f8e}
  .card .d{margin-top:4px;font-size:17px;font-weight:700;letter-spacing:-1px;color:#59808b;line-height:1.35}

  .bub{position:absolute;background:#fff;border:3px solid #0f3744;border-radius:22px;padding:12px 18px;
       font-family:"Gaegu",cursive;font-weight:700;font-size:27px;color:#0f3744;line-height:1.24;text-align:center;
       box-shadow:4px 5px 0 rgba(15,55,68,.18)}
  .bub::after{content:"";position:absolute;width:17px;height:17px;background:inherit;
    border-right:3px solid #0f3744;border-bottom:3px solid #0f3744;transform:rotate(35deg)}
  .b1{left:548px;top:18px;background:#fff7cf}
  .b1::after{background:#fff7cf;right:44px;bottom:-10px}
  .b2{right:22px;bottom:88px}
  .b2::after{left:46px;bottom:-10px}
  .crown{position:absolute;left:596px;top:-8px;font-size:32px;transform:rotate(-12deg);z-index:2}

  .ribbon{position:absolute;left:0;right:0;bottom:0;height:72px;background:#0f3744;
          display:flex;align-items:center;justify-content:center;gap:20px}
  .ribbon .slog{font-family:"Gaegu",cursive;font-weight:700;font-size:30px;color:#ffe23d;letter-spacing:-1px}
  .ribbon .slog b{color:#fff}
  .ribbon .tel{background:#ff2f8e;color:#fff;font-size:25px;font-weight:900;padding:8px 20px;border-radius:999px}
  .ribbon .dom{font-size:21px;font-weight:800;color:#86c3d4}
</style>
</head>
<body>
<div class="photo"></div>

<span class="crown">👑</span>
<div class="bub b1">구미 전문과외로<br/>내신도 수능도 자신있게!</div>
<div class="bub b2">지금이<br/>바로 시작할 시간!</div>

<div class="title">
  <div class="kicker">제대로 배워야 성적이 달라집니다!</div>
  <div class="big"><span class="l1">구미</span><span class="l2">전문과외</span></div>
  <div class="band">초 · 중 · 고 <b>내신 대비</b></div>
  <div class="sub"><span>기초부터 심화까지 1:1 맞춤 수업</span></div>
</div>

<div class="cards">
  <div class="card c1"><div class="ic">📘</div><div class="t">전과목 <em>과외</em></div><div class="d">국어·영어·수학<br/>사회·과학·한국사</div></div>
  <div class="card c2"><div class="ic">🎓</div><div class="t">내신 · <em>수능</em></div><div class="d">학교별 기출 분석<br/>초1~고3·재수생</div></div>
</div>

<div class="ribbon">
  <span class="slog">구미 전문과외가 만드는 <b>오늘보다 더 높은 내일!</b></span>
  <span class="tel">📞 010-6832-1994</span>
  <span class="dom">nadoedu.kr</span>
</div>
</body>
</html>
